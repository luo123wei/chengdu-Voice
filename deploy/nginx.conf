# Nginx configuration for voiceculture.world (chengdu-voice project)
# Use this file as a template. Replace paths with your actual setup on the server.

# --- HTTP to HTTPS Redirect ---
server {
    listen 80;
    server_name voiceculture.world www.voiceculture.world;

    # If SSL is configured, uncomment the following line to force HTTPS
    # return 301 https://$host$request_uri;

    # If you want to serve on HTTP only initially, use the below proxy_pass.
    # Otherwise, comment out the server block below and enable the redirect above.
    
    location / {
        proxy_pass http://127.0.0.1:3000; # Port where Next.js app runs
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

