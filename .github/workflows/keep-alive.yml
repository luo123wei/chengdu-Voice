name: Keep Render App Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render app
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://chengdu-voice.onrender.com
          curl -s -o /dev/null -w "%{http_code}" https://chengdu-voice.onrender.com/api/products
          curl -s -o /dev/null -w "%{http_code}" https://chengdu-voice.onrender.com/api/blogs